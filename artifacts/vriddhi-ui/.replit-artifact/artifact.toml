kind = "web"
previewPath = "/"
title = "Vriddhi Research — Component Library"
version = "1.0.0"
id = "artifacts/vriddhi-ui"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24399

[services.development]
run = "pnpm --filter @workspace/vriddhi-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vriddhi-ui", "run", "build" ]
serve = "static"
publicDir = "artifacts/vriddhi-ui/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24399"
BASE_PATH = "/"
